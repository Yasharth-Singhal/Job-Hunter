name: Daily Telegram Job Harvest

on:
  schedule:
    # Runs at 09:00 AM IST (03:30 AM UTC) every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from phone via GitHub App or website anytime

jobs:
  harvest-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix server install

      - name: Build Server
        run: npm --prefix server run build

      - name: Execute Autonomous Job Harvest & Telegram Dispatch
        env:
          PORT: 4000
        run: npm --prefix server run dispatch
